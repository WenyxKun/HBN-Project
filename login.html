<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <title>login</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

        <link rel="stylesheet" href="Assets/css/style.css"/>

        <style>
            .error-notification {
                color: #721c24;
                background-color: #f8d7da;
                border: 1px solid #f5c6cb;
                padding: 10px;
                border-radius: 4px;
                margin-bottom: 15px;
                display: none;
                /* Awalnya disembunyikan */
            }
        </style>

    </head>
    <body class="bg-gray-100">
        <div class="shadow bg-white">
            <div class="h-20 mx-auto px-5 flex items-center justify-between">
                <a class="navbar-brand ps-3" href="index.html">
                    <img src="Assets\Img\Gambar1.jpg" width="50" height="50" alt="">
                </a>

                <ul class="flex items-center gap-5">
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="index.html#portfolio">Portofolio</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="index.html#about">Tentang Kami</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="index.html#contact">Kontak</a>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="login.html">Masuk</a>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="register.html">Daftar</a>
                </ul>
            </div>
        </div>

        <main class="min-h-[calc(100vh-160px)] flex items-center justify-center p-4">
            <div class="auth-container">
                <!-- Notifikasi Error -->
                <div id="error-notification" class="notification hidden">
                    <span id="error-message"></span>
                </div>
                <form
                    id="loginForm"
                    action="/HBN-Project/backend/login.php"
                    method="POST"
                    aria-label="Form Buat Akun"
                    class="bg-white p-8 w-full max-w-md shadow-lg rounded-lg">
                    <!-- Diubah max-w-xs menjadi max-w-md dan shadow-sm menjadi shadow-lg -->
                    <h2 class="text-center font-bold text-xl mb-6 border-b border-gray-300 pb-3">Masuk</h2>
                    <!-- Ukuran teks diperbesar -->

                    <div class="space-y-4">
                        <div class="form-floating mb-3">
                            <input
                                class="form-control"
                                id="inputEmail"
                                name="email"
                                type="email"
                                placeholder="name@example.com"
                                required="required"/>
                            <label for="inputEmail">Email address</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input
                                class="form-control"
                                id="inputPassword"
                                name="password"
                                type="password"
                                placeholder="Password"
                                required="required"/>
                            <label for="inputPassword">Password</label>
                        </div>

                        <p class="text-left text-sm text-gray-700 mt-3">
                            <a class="text-blue-500 hover:underline" href="password.html">Lupa password?</a>
                        </p>

                    </div>

                    <button
                        class="w-full bg-[#E60023] text-white text-sm font-semibold rounded-lg py-3 mt-6 hover:bg-red-700 transition-colors"
                        type="submit">Masuk</button>
                    <!-- Ukuran tombol diperbesar -->

                    <p class="text-center font-bold mb-3 border-gray-300 mt-3">atau</p>

                    <button
                        class="w-full bg-blue-500 text-white text-sm font-semibold rounded-lg py-3 hover:bg-blue-600 transition-colors"
                        type="submit">Masuk dengan Facebook</button>

                    <button
                        class="w-full bg-white-500 text-black border border-gray-300 text-sm font-semibold rounded-lg py-3 mt-3 hover:bg-gray-200 transition-colors"
                        type="submit">Masuk dengan Google</button>

                    <p class="text-center text-sm text-gray-700 mt-4">
                        <!-- Ukuran teks diperbesar -->
                        Belum punya akun?
                        <a class="text-blue-500 hover:underline" href="register.html">Buat akun</a>
                    </p>

                </form>
            </main>

            <!-- Footer tetap sama -->
            <footer class="bg-gray-900 text-gray-300 text-xs px-6 py-8">
                <div
                    aria-label="Footer Info"
                    class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-8 sm:gap-12">
                    <!-- Konten footer tetap sama -->
                </div>
                <p class="text-gray-500 text-[10px] mt-8 max-w-7xl mx-auto">Copyright © 2025 YN Merch. All Rights Reserved.</p>
            </footer>

            <!-- Pindahkan script ke bawah body -->
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    const urlParams = new URLSearchParams(window.location.search);
                    const error = urlParams.get('error');
                    const errorBox = document.getElementById('errorBox');

                    // Tampilkan error jika ada
                    if (error) {
                        const messages = {
                            'invalid_input': 'Input tidak valid',
                            'auth_failed': 'Email atau password salah',
                            'system_error': 'Terjadi kesalahan sistem'
                        };

                        errorBox.textContent = messages[error] || 'Terjadi kesalahan';
                        errorBox.style.display = 'block';
                    }

                    // Validasi form sebelum submit
                    document
                        .getElementById('loginForm')
                        .addEventListener('submit', function (e) {
                            const email = this
                                .email
                                .value
                                .trim();
                            const password = this
                                .password
                                .value
                                .trim();

                            if (!email || !password) {
                                e.preventDefault();
                                errorBox.textContent = 'Email dan password harus diisi';
                                errorBox.style.display = 'block';
                            }
                        });
                });
            </script>

            <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
            <script
                src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
            <script
                src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
            <script src="Assets\js\pricing.js"></script>
            <script
                src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script src="assets/js/scripts.js"></script>
                        <script src="../Assets/js/auth.js"></script>
        </body>
    </html>
