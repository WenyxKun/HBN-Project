<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Buat Akun</title>
        <!-- SIMPLIFIKASI LIBRARY -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
        <link rel="stylesheet" href="Assets/css/style.css"/>
    </head>
    <body class="bg-gray-100">
        <div class="shadow bg-white">
            <div class="h-20 mx-auto px-5 flex items-center justify-between">
                <a class="navbar-brand ps-3" href="index.html">
                    <img src="Assets\Img\Gambar1.jpg" width="50" height="50" alt="">
                </a>

                <ul class="flex items-center gap-5">
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="#portfolio">Portofolio</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="#about">Tentang Kami</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="#contact">Kontak</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="login.html">Masuk</a>
                    </li>
                    <li>
                        <a class="hover:text-cyan-500 transition-colors" href="register.html">Daftar</a>
                    </li>
                </ul>
            </div>
        </div>

        <main class="min-h-[calc(100vh-160px)] flex items-center justify-center p-4">
            <form id="registerForm" class="bg-white p-8 w-full max-w-md shadow-lg rounded-lg" novalidate>
                <h2 class="text-center font-bold text-xl mb-6 border-b border-gray-300 pb-3">Buat Akun</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Nama</label>
                        <input
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            name="name"
                            placeholder="Nama anda"
                            type="text"
                            required="required">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">Email</label>
                        <input
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            name="email"
                            placeholder="Email anda"
                            type="email"
                            required="required">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">No Telepon</label>
                        <input
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            name="phone"
                            placeholder="No. WhatsApp anda"
                            type="tel">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">Password</label>
                        <input
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            name="password"
                            placeholder="Password (min 8 karakter)"
                            type="password"
                            minlength="8"
                            required="required">
                    </div>

<div>
    <label class="block text-sm font-semibold mb-2">Konfirmasi Password</label>
    <input
        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        name="confirm_password"
        placeholder="Ulangi password Anda"
        type="password"
        minlength="8"
        required>
</div>                    

                </div>

                <button type="submit" class="w-full bg-blue-500 text-white text-sm font-semibold rounded-lg py-3 mt-6 hover:bg-blue-600 transition-colors flex justify-center items-center gap-2">
                    <span id="submitText">Daftar</span>
                    <svg id="spinner" class="hidden w-5 h-5 text-white animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>

                <p class="text-center text-sm text-gray-700 mt-4">
                    Sudah punya akun?
                    <a class="text-blue-500 hover:underline" href="login.html">Masuk</a>
                </p>
            </form>
        </main>

        <footer class="bg-gray-900 text-gray-300 text-xs px-6 py-8">
            <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-8 sm:gap-12">
                <!-- Konten footer -->
            </div>
            <p class="text-gray-500 text-[10px] mt-8 max-w-7xl mx-auto">Copyright © 2025 YN Merch. All Rights Reserved.</p>
        </footer>

        <!-- Load JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="Assets/js/auth.js"></script>
    </body>
</html>
